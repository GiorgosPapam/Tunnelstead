name: Verify release
# Releases are built and signed on the maintainer's machine (tools/release.py) so the signing key never reaches CI.
# This workflow checks every published release: the bundle's signature must match installer/release-key.pub
# and the tag must match the bundle's version. It then attaches SHA256SUMS.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - name: Download assets
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.event.release.tag_name }}" }
        run: |
          mkdir dl && gh release download "$TAG" --dir dl --pattern 'vpnix-create-*'
          ls -l dl
      - name: Verify signature and version
        env: { TAG: "${{ github.event.release.tag_name }}" }
        run: |
          V="${TAG#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vX.Y.Z"; exit 1; }
          python - "$V" <<'PY'
          import base64, hashlib, io, sys, tarfile
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          v = sys.argv[1]; b = open(f"dl/vpnix-create-{v}.tar.gz", "rb").read()
          sig = base64.b64decode(open(f"dl/vpnix-create-{v}.tar.gz.sig").read().strip())
          pub = Ed25519PublicKey.from_public_bytes(base64.b64decode(open("installer/release-key.pub").read().strip()))
          pub.verify(sig, f"vpnix-create-release:{v}:{hashlib.sha256(b).hexdigest()}".encode())
          with tarfile.open(fileobj=io.BytesIO(b)) as t:
              assert t.extractfile(f"vpnix-create-{v}/VERSION").read().decode().strip() == v
          print(f"OK: vpnix-create-{v} is signed by the release key")
          PY
      - name: Attach SHA256SUMS
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.event.release.tag_name }}" }
        run: |
          (cd dl && sha256sum vpnix-create-* > SHA256SUMS)
          gh release upload "$TAG" dl/SHA256SUMS --clobber
